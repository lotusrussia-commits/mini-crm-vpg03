services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini-crm-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app/backend
      - ./google_integration:/app/google_integration
      - ./config:/app/config
      - ./data:/app/data
    command: >
      uvicorn backend.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/backend
    restart: unless-stopped
